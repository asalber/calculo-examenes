project:
  type: book
  output-dir: "docs"

website:
  favicon: "img/logos/favicon.ico"
  reader-mode: true
  comments: 
    hypothesis:
      theme: clean
      openSidebar: true

book:
  title: "Exámenes de Cálculo"
  author: "Alfredo Sánchez Alberca"
  date: "7/11/2016"
  output-file: "examenes-calculo"
  image: img/logos/sticker.png
  cover-image: img/logos/sticker.png
  sharing: [twitter, linkedin]
  downloads: [pdf, epub]
  favicon: "img/logos/favicon.ico"
  sidebar: 
    logo: img/logos/aprendeconalf.png
    tools:
      - icon: house-fill
        href: https://aprendeconalf.es
  open-graph: true
  twitter-card: 
    site: "@aprendeconalf"
  chapters:
    - index.qmd
    - examen-2016-11-07.qmd
    - examen-2017-01-10.qmd
    - examen-2017-11-06.qmd
    - examen-2018-01-19.qmd
    - examen-2018-12-17.qmd
    - examen-2019-12-16.qmd
    - examen-2021-01-18.qmd

format:
  html:
    highlight-style: a11y
    theme:
      dark: darkly
      light: flatly
    html-math-method: mathjax
    default-image-extension: svg
  pdf:
    documentclass: scrreport
    papersize: a4
    template-partials:
      - before-body.tex
    titlegraphic: img/logos/sticker.png
    institution: CEU San Pablo
    email: asalber@ceu.es
    web: https://aprendeconalf.es
    logo: img/logos/aprendeconalf.png
    include-in-header:
      - preamble.tex
      - macros.tex
    keep-tex: true
    default-image-extension: pdf 

  epub:
    cover-image: img/logos/sticker.png
